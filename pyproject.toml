[project]
name = "interetread"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "celery[redis]>=5.6,<5.7",
    "fastapi>=0.165.0",
    "feedparser>=6,<7",
    "httpx>=0.28,<1",
    # 当前 Redis 6.0 不支持 Kombu 5.7 使用的 Redis 6.2 命令。
    "kombu>=5.6.2,<5.7",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2,<3",
    "pyyaml>=6,<7",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
